<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="#f7f8fb"/>
  <text x="40" y="54" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#172033">Reversal-zone signal candle shapes</text>
  <text x="40" y="84" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#596579">Based on src/signal-engine.ts: fresh lookback extreme + rejection candle + outer 20% range + price-R >= 3.5 + confidence >= 72.</text>

  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d9dee8; stroke-width: 1.2; rx: 12; }
      .grid { stroke: #e8ebf1; stroke-width: 1; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #253045; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #667085; }
      .axis { stroke: #a7afbd; stroke-width: 1.2; stroke-dasharray: 6 6; }
      .green { fill: #089981; stroke: #089981; }
      .red { fill: #f23645; stroke: #f23645; }
      .wick-green { stroke: #089981; stroke-width: 3; stroke-linecap: round; }
      .wick-red { stroke: #f23645; stroke-width: 3; stroke-linecap: round; }
      .blue { stroke: #2962ff; fill: none; stroke-width: 2.5; }
      .blue-text { fill: #2962ff; font-family: Arial, Helvetica, sans-serif; }
      .orange { stroke: #f59e0b; fill: none; stroke-width: 2.5; }
      .orange-fill { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.4; }
      .bad-fill { fill: #fff1f2; stroke: #f43f5e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="35" y="120" width="585" height="430" class="panel"/>
  <text x="60" y="156" class="label" font-size="24" font-weight="700">Bullish alert: fresh low is rejected</text>
  <text x="60" y="182" class="muted" font-size="15">Must be the latest completed 5m candle.</text>

  <g transform="translate(60,205)">
    <line x1="0" y1="35" x2="520" y2="35" class="grid"/>
    <line x1="0" y1="105" x2="520" y2="105" class="grid"/>
    <line x1="0" y1="175" x2="520" y2="175" class="grid"/>
    <line x1="0" y1="245" x2="520" y2="245" class="grid"/>
    <line x1="0" y1="315" x2="520" y2="315" class="grid"/>
    <line x1="0" y1="77" x2="520" y2="77" class="axis"/>
    <text x="407" y="67" class="blue-text" font-size="14">VWAP / target above price</text>
    <path d="M0,72 C110,68 180,80 260,76 C350,72 430,77 520,73" class="blue"/>
    <line x1="0" y1="259" x2="520" y2="259" stroke="#14b8a6" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="367" y="252" class="muted" font-size="14">bottom 20% close zone</text>

    <g>
      <line x1="30" y1="124" x2="30" y2="173" class="wick-red"/><rect x="18" y="130" width="24" height="35" class="red"/>
      <line x1="75" y1="155" x2="75" y2="209" class="wick-red"/><rect x="63" y="163" width="24" height="36" class="red"/>
      <line x1="120" y1="187" x2="120" y2="237" class="wick-red"/><rect x="108" y="194" width="24" height="32" class="red"/>
      <line x1="165" y1="210" x2="165" y2="262" class="wick-red"/><rect x="153" y="218" width="24" height="28" class="red"/>
      <line x1="210" y1="229" x2="210" y2="279" class="wick-red"/><rect x="198" y="240" width="24" height="27" class="red"/>
      <line x1="255" y1="241" x2="255" y2="292" class="wick-red"/><rect x="243" y="251" width="24" height="26" class="red"/>
      <line x1="300" y1="250" x2="300" y2="304" class="wick-red"/><rect x="288" y="262" width="24" height="25" class="red"/>
      <line x1="345" y1="259" x2="345" y2="315" class="wick-red"/><rect x="333" y="272" width="24" height="24" class="red"/>
      <line x1="405" y1="207" x2="405" y2="341" class="wick-green"/><rect x="386" y="242" width="38" height="76" class="green"/>
    </g>
    <line x1="370" y1="318" x2="435" y2="318" stroke="#111827" stroke-width="2"/>
    <text x="345" y="336" class="label" font-size="15" font-weight="700">latest low pierces prior low</text>
    <path d="M415,340 C465,330 490,303 500,272" class="orange"/>
  </g>

  <rect x="660" y="120" width="585" height="430" class="panel"/>
  <text x="685" y="156" class="label" font-size="24" font-weight="700">Bearish alert: fresh high is rejected</text>
  <text x="685" y="182" class="muted" font-size="15">Mirror image: latest completed 5m candle rejects a lookback high.</text>

  <g transform="translate(685,205)">
    <line x1="0" y1="35" x2="520" y2="35" class="grid"/>
    <line x1="0" y1="105" x2="520" y2="105" class="grid"/>
    <line x1="0" y1="175" x2="520" y2="175" class="grid"/>
    <line x1="0" y1="245" x2="520" y2="245" class="grid"/>
    <line x1="0" y1="315" x2="520" y2="315" class="grid"/>
    <line x1="0" y1="252" x2="520" y2="252" class="axis"/>
    <text x="381" y="274" class="blue-text" font-size="14">VWAP / target below price</text>
    <path d="M0,258 C115,264 200,249 290,255 C380,262 450,251 520,257" class="blue"/>
    <line x1="0" y1="91" x2="520" y2="91" stroke="#14b8a6" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="367" y="82" class="muted" font-size="14">top 20% close zone</text>

    <g>
      <line x1="30" y1="262" x2="30" y2="312" class="wick-green"/><rect x="18" y="270" width="24" height="32" class="green"/>
      <line x1="75" y1="229" x2="75" y2="285" class="wick-green"/><rect x="63" y="240" width="24" height="34" class="green"/>
      <line x1="120" y1="199" x2="120" y2="253" class="wick-green"/><rect x="108" y="209" width="24" height="35" class="green"/>
      <line x1="165" y1="168" x2="165" y2="221" class="wick-green"/><rect x="153" y="178" width="24" height="32" class="green"/>
      <line x1="210" y1="141" x2="210" y2="194" class="wick-green"/><rect x="198" y="151" width="24" height="30" class="green"/>
      <line x1="255" y1="120" x2="255" y2="172" class="wick-green"/><rect x="243" y="130" width="24" height="29" class="green"/>
      <line x1="300" y1="104" x2="300" y2="157" class="wick-green"/><rect x="288" y="114" width="24" height="27" class="green"/>
      <line x1="345" y1="90" x2="345" y2="144" class="wick-green"/><rect x="333" y="101" width="24" height="26" class="green"/>
      <line x1="405" y1="30" x2="405" y2="164" class="wick-red"/><rect x="386" y="54" width="38" height="77" class="red"/>
    </g>
    <line x1="370" y1="56" x2="435" y2="56" stroke="#111827" stroke-width="2"/>
    <text x="347" y="22" class="label" font-size="15" font-weight="700">latest high pierces prior high</text>
    <path d="M414,31 C464,42 489,72 501,105" class="orange"/>
  </g>

  <rect x="35" y="585" width="1210" height="125" class="panel"/>
  <text x="60" y="622" class="label" font-size="22" font-weight="700">What will not alert, even if it feels dramatic</text>
  <g transform="translate(60,642)">
    <rect x="0" y="0" width="365" height="48" class="bad-fill" rx="8"/>
    <text x="18" y="30" class="label" font-size="15">Continuation selloff: no bullish rejection close.</text>
    <rect x="405" y="0" width="365" height="48" class="orange-fill" rx="8"/>
    <text x="423" y="30" class="label" font-size="15">Mid-range bounce: close is outside neither extreme.</text>
    <rect x="810" y="0" width="345" height="48" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4" rx="8"/>
    <text x="828" y="30" class="label" font-size="15">Weak reward: target offers less than 3.5R.</text>
  </g>
</svg>
