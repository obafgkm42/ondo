[project]
name = "hyperliquid-sp500-reversal-scanner-backtest"
version = "0.1.0"
description = "Backtest and event-study tooling for the Hyperliquid SP500 Reversal Scanner."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
]

[project.scripts]
reversal-scanner-backtest = "reversal_scanner_backtest.cli:main"
fragility-backtest = "reversal_scanner_backtest.fragility_cli:main"
fragility-v2-evaluate = "reversal_scanner_backtest.fragility_v2_cli:main"
fragility-shadow-report = "reversal_scanner_backtest.fragility_shadow_report_cli:main"
resilience-decay-backtest = "reversal_scanner_backtest.resilience_decay_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/reversal_scanner_backtest"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
